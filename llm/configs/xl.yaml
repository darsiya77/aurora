# XL (1.2B parameters): ~460 GPU-hours (2.5 days on 8 GPUs, 15 hours on 32). Smallest size worth turning into an assistant.
name: xl
model:
  vocab_size: 64000
  d_model: 2048
  n_layers: 24
  n_heads: 16
  n_kv_heads: 8
  max_seq_len: 4096
train:
  out_dir: runs/xl
  batch_size: 8              # per GPU
  grad_accum: 4              # x 32 GPUs = 4M tokens per step
  max_steps: 7000            # = 28B tokens (about 20 tokens per parameter)
  lr: 2.0e-4
  min_lr: 2.0e-5
  warmup_steps: 2000
  eval_every: 500
  save_every: 250
  compile: true
sft:
  base_checkpoint: runs/xl/best.pt
  out_dir: runs/xl-sft
