# Base (330M parameters): 8 data-centre GPUs, about 5 hours (~35 GPU-hours). Coherent paragraphs, simple facts.
name: base
model:
  vocab_size: 50000
  d_model: 1024
  n_layers: 24
  n_heads: 16
  n_kv_heads: 8
  max_seq_len: 2048
train:
  out_dir: runs/base
  batch_size: 16             # per GPU
  grad_accum: 4              # x 8 GPUs = 1M tokens per step
  max_steps: 8000            # = 8B tokens
  lr: 3.0e-4
  min_lr: 3.0e-5
  warmup_steps: 2000
  eval_every: 500
  save_every: 500
  compile: true
sft:
  base_checkpoint: runs/base/best.pt
  out_dir: runs/base-sft
