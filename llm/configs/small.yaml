# Small (39M parameters): one consumer GPU, about 3 hours. Writes grammatical Russian sentences.
name: small
model:
  vocab_size: 32000
  d_model: 512
  n_layers: 8
  n_heads: 8
  n_kv_heads: 4
  max_seq_len: 1024
train:
  out_dir: runs/small
  batch_size: 32
  grad_accum: 4
  max_steps: 20000           # 20000 x 131k tokens = 2.6B tokens
  lr: 6.0e-4
  min_lr: 6.0e-5
  warmup_steps: 1000
  eval_every: 1000
  save_every: 1000
  compile: true
sft:
  base_checkpoint: runs/small/best.pt
  out_dir: runs/small-sft
