[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aurora-llm"
version = "0.1.0"
description = "Own decoder-only language model: data, tokenizer, pretraining, chat fine-tuning, serving"
requires-python = ">=3.10"
dependencies = ["torch>=2.3", "tokenizers>=0.19", "numpy>=1.26", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
assistant = ["transformers>=4.57", "peft>=0.17", "safetensors>=0.4", "tiktoken>=0.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
